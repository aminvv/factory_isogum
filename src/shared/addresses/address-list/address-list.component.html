<div class="address-list" dir="rtl">

  <div class="page-header">
    <div>
      <h2 class="page-title">آدرس‌های من</h2>
      <p class="page-sub">مدیریت آدرس‌های تحویل</p>
    </div>
    <button class="add-btn" (click)="openAdd()">
      <i class="ti ti-plus"></i> افزودن آدرس
    </button>
  </div>

  <!-- Loading -->
  <div class="state-box" *ngIf="loading">
    <div class="spinner"></div>
    <p>در حال دریافت آدرس‌ها...</p>
  </div>
<div class="empty"></div>
  <!-- List -->
  <div class="list" *ngIf="!loading">

    <div class="address-card" *ngFor="let addr of addresses" [class.default]="addr.isDefault">
      <div class="card-top">
        <div class="icon">
          <i class="ti ti-map-pin"></i>
        </div>
        <div class="meta">
          <div class="loc">{{ addr.province }}، {{ addr.city }}</div>
          <div class="str">{{ addr.street  |persianNumber}}<span *ngIf="addr.plaque">، پلاک {{ addr.plaque |persianNumber }}</span></div>
        </div>
        <span class="def-badge" *ngIf="addr.isDefault">
          <i class="ti ti-star"></i> پیش‌فرض
        </span>
      </div>
      <div class="card-mid">
        <div class="info-row">
          <i class="ti ti-mailbox"></i>
          <span>کدپستی: {{ addr.postalCode |persianNumber }}</span>
        </div>
      </div>
      <div class="card-foot">
        <button class="btn-edit" (click)="openEdit(addr)">
          <i class="ti ti-edit"></i> ویرایش
        </button>
        <button class="btn-del" (click)="deleteAddress(addr.id)">
          <i class="ti ti-trash"></i> حذف
        </button>
      </div>
    </div>

    <!-- Add new card -->
    <div class="add-card" (click)="openAdd()">
      <i class="ti ti-plus"></i>
      <span>افزودن آدرس جدید</span>
    </div>

  </div>

  <!-- Form Modal -->
  <div class="overlay" *ngIf="showForm" (click)="cancel()"></div>
  <div class="drawer" *ngIf="showForm">
    <div class="drawer-header">
      <h3>{{ editingAddress ? 'ویرایش آدرس' : 'افزودن آدرس جدید' }}</h3>
      <button class="close-btn" (click)="cancel()"><i class="ti ti-x"></i></button>
    </div>
    <div class="drawer-body">
      <div class="form-row">
        <div class="field">
          <label>استان</label>
          <input [(ngModel)]="form.province" placeholder="مثال: تهران" />
        </div>
        <div class="field">
          <label>شهر</label>
          <input [(ngModel)]="form.city" placeholder="مثال: تهران" />
        </div>
      </div>
      <div class="field">
        <label>خیابان / آدرس کامل</label>
        <input [(ngModel)]="form.street" placeholder="خیابان، کوچه، ..." />
      </div>
      <div class="form-row">
        <div class="field">
          <label>کدپستی</label>
          <input [(ngModel)]="form.postalCode" placeholder="۱۰ رقم" />
        </div>
        <div class="field">
          <label>پلاک</label>
          <input [(ngModel)]="form.plaque" placeholder="اختیاری" />
        </div>
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="isDefault" [(ngModel)]="form.isDefault" />
        <label for="isDefault">تنظیم به عنوان آدرس پیش‌فرض</label>
      </div>
    </div>
    <div class="drawer-footer">
      <button class="save-btn" (click)="saveAddress()">
        <i class="ti ti-check"></i>
        {{ editingAddress ? 'ذخیره تغییرات' : 'افزودن آدرس' }}
      </button>
      <button class="cancel-btn" (click)="cancel()">انصراف</button>
    </div>
  </div>

</div>
