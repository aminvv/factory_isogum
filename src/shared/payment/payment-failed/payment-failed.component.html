<div class="failed-page" dir="rtl">
  <div class="content">

    <!-- Icon -->
    <div class="icon-wrap">
      <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="26" r="25" stroke="currentColor" stroke-width="2"/>
        <path d="M17 17L35 35M35 17L17 35" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>پرداخت ناموفق</h1>
    <p class="subtitle">متأسفانه پرداخت شما انجام نشد</p>

    <!-- Reasons -->
    <div class="reasons-card">
      <div class="reasons-title">دلایل احتمالی:</div>
      <ul>
        <li>انصراف از پرداخت</li>
        <li>موجودی کافی نبود</li>
        <li>خطا در اتصال به درگاه بانکی</li>
        <li>منقضی شدن زمان پرداخت</li>
      </ul>
    </div>

    <p class="note">مبلغی از حساب شما کسر نشده است.</p>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-primary" (click)="tryAgain()">تلاش مجدد</button>
      <button class="btn-secondary" (click)="continueShopping()">بازگشت به فروشگاه</button>
    </div>

  </div>
</div>
