<div class="basket-container">
  <h2>سبد خرید</h2>

  <div *ngIf="loading" class="loading">در حال بارگذاری...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>

  <!-- فرم افزودن محصول -->
  <div class="form-section">
    <h3>افزودن محصول جدید</h3>
    <form [formGroup]="addProductForm" (ngSubmit)="addProduct()">
      <div class="form-group">
        <label>شناسه محصول</label>
        <input type="number" formControlName="productId" placeholder="مثال: 14" />
        <div *ngIf="addProductForm.get('productId')?.invalid && addProductForm.get('productId')?.touched" class="field-error">
          شناسه محصول الزامی است.
        </div>
      </div>
      <div class="form-group">
        <label>تعداد</label>
        <input type="number" formControlName="quantity" min="1" />
      </div>
      <button type="submit" [disabled]="addProductForm.invalid">افزودن به سبد</button>
    </form>
  </div>

  <!-- فرم کد تخفیف -->
  <div class="form-section">
    <h3>کد تخفیف</h3>
    <form [formGroup]="discountForm" (ngSubmit)="applyDiscount()">
      <div class="form-group">
        <label>کد تخفیف</label>
        <input type="text" formControlName="code" placeholder="کد خود را وارد کنید" />
      </div>
      <div class="discount-buttons">
        <button type="submit" [disabled]="discountForm.invalid">اعمال تخفیف</button>
        <button type="button" (click)="removeDiscount()">حذف تخفیف</button>
      </div>
    </form>
  </div>


</div>
