<div
  class="slider-wrapper"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="slider-track" [style.transform]="'translateX(' + (currentIndex * 100) + '%)'">
    <div class="slide" *ngFor="let slide of slides">
      <div class="slide-image-wrap">
        <img [src]="slide.image" [alt]="slide.title" loading="lazy" />
        <div class="slide-overlay"></div>
      </div>
      <div class="slide-content">
        <h3 class="slide-title">{{ slide.title }}</h3>
        <p class="slide-desc" *ngIf="slide.description">{{ slide.description }}</p>
        <a
          *ngIf="slide.link"
          [routerLink]="slide.link"
          class="slide-btn"
        >
          {{ slide.linkText || 'مشاهده بیشتر' }}
        </a>
      </div>
    </div>
  </div>

  <button class="slider-arrow slider-arrow--prev" (click)="prev()" aria-label="اسلاید قبلی">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path d="M15.5 19L8.5 12L15.5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="slider-arrow slider-arrow--next" (click)="next()" aria-label="اسلاید بعدی">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path d="M8.5 5L15.5 12L8.5 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="slider-dots" *ngIf="slides.length > 1">
    <button
      *ngFor="let slide of slides; let i = index"
      class="slider-dot"
      [class.active]="i === currentIndex"
      (click)="goTo(i)"
      [attr.aria-label]="'رفتن به اسلاید ' + (i + 1)"
    ></button>
  </div>

  <div class="slider-progress" *ngIf="autoPlay && slides.length > 1">
    <div
      class="slider-progress-bar"
      [style.animationDuration]="autoPlayInterval + 'ms'"
      [attr.key]="currentIndex"
    ></div>
  </div>
</div>
