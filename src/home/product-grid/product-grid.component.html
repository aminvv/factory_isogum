<div class="product-grid-wrap" dir="rtl">

  <!-- Loading skeleton -->
  <section class="grid-section" *ngIf="isLoading && products.length === 0">
    <div class="product-card skeleton" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="skeleton-img"></div>
      <div class="skeleton-body">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>
  </section>

  <!-- Grid -->
  <section class="grid-section" *ngIf="products.length > 0">
    <div class="product-card" *ngFor="let product of products" (click)="goToDetail(product.id)"
      [class.out-of-stock]="isOutOfStock(product)">

      <!-- Image -->
      <div class="img-wrap">
        <img [src]="getImage(product)" [alt]="product.productName"
          onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/f3f4f6/9ca3af?text=بدون+عکس'" />
        <span class="disc-badge" *ngIf="hasDiscount(product)">{{ getDiscountPercent(product) }}٪</span>
        <div class="out-overlay" *ngIf="isOutOfStock(product)">ناموجود</div>
      </div>

      <!-- Body -->
      <div class="body">
        <!-- Stars -->


        <div class="content-rating-name">
            <p class="name">{{ product.productName }}</p>
          <div class="stars" *ngIf="product.rating" dir="ltr"
            style="display: flex; align-items: center; justify-content: flex-start;">
            <span style="margin-left: 5px;">{{ product.rating |persianNumber}}</span>
            <ng-container *ngFor="let s of getStars(product.rating)">
              <i class="ti" [ngClass]="s" aria-hidden="true"></i>
            </ng-container>
          </div>
        </div>
        <div class="code">{{ product.productCode }}</div>


        <!-- Feature tags -->
        <div class="feat">
          <span class="feat-tag" *ngIf="product.deliveryCost">
            <i class="ti ti-truck" aria-hidden="true"></i>
            {{ product.deliveryCost }}
          </span>
          <span class="feat-tag" *ngIf="product.insurance">
            <i class="ti ti-shield" aria-hidden="true"></i> بیمه
          </span>
        </div>

        <!-- Price + Cart -->
        <div class="price-row">
          <div class="prices">
            <span class="old-price" *ngIf="hasDiscount(product)">
              {{ formatPrice(product.price) }} تومان
            </span>
            <span class="final-price">
              {{ formatPrice(getFinalPrice(product)) }}
              <small>تومان</small>
            </span>
          </div>
          <button class="cart-btn" (click)="addToCart($event, product)" [disabled]="isOutOfStock(product)"
            [attr.aria-label]="isOutOfStock(product) ? 'ناموجود' : 'افزودن به سبد خرید'">
            <i class="ti" [ngClass]="isOutOfStock(product) ? 'ti-shopping-cart-off' : 'ti-shopping-cart-plus'"
              aria-hidden="true"></i>
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- Loading more -->
  <div class="loading-more" *ngIf="isLoading && products.length > 0">
    <div class="spinner"></div>
  </div>

  <!-- Load More -->
  <div class="load-more-wrap" *ngIf="!isLoading && hasMoreProducts && products.length > 0">
    <button class="load-more-btn" (click)="loadMore()">محصولات بیشتر</button>
  </div>

  <!-- Empty -->
  <div class="no-products" *ngIf="products.length === 0 && !isLoading">
    <p>محصولی یافت نشد</p>
  </div>

</div>
